<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华设备中心</title><style>:root{font-family:Inter,"PingFang SC",sans-serif;color:#172238;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#14243c;color:#c9d4e5;padding:26px 18px}.logo{font-size:20px;color:white;font-weight:700}.logo small{display:block;font-size:11px;color:#7890ad;margin-top:4px}.nav{margin-top:36px}.nav div{padding:11px 14px;border-radius:7px;margin:4px 0}.nav .on{background:#1c806f;color:white}main{padding:30px 34px}h1{margin:0;font-size:25px}.sub{color:#77859b;font-size:13px}.top{display:flex;justify-content:space-between}.healthy{color:#1c806f;background:#e6f4f1;padding:7px 12px;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:25px 0}.card{background:white;border:1px solid #e2e7ee;border-radius:9px;padding:18px}.stat b{display:block;font-size:28px;margin-top:7px}.work{display:grid;grid-template-columns:1fr 340px;gap:15px}h2{font-size:16px;margin:0 0 13px}.row{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:10px;padding:14px 0;border-top:1px solid #edf0f4}.online,.critical{font-size:11px;border-radius:12px;padding:4px 8px;width:max-content}.online{background:#e6f4f1;color:#1c806f}.critical{background:#fdeceb;color:#b13c34}.alert{border-top:1px solid #edf0f4;padding:13px 0}.alert b{font-size:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:repeat(2,1fr)}.work{grid-template-columns:1fr}main{padding:20px}}</style></head><body><div class="layout"><aside><div class="logo">知华设备中心<small>DEVICEHUB CONTROL PLANE</small></div><div class="nav"><div class="on">设备总览</div><div>产品模型</div><div>设备影子</div><div>远程指令</div><div>固件升级</div><div>告警中心</div><div>安全审计</div></div></aside><main><div class="top"><div><h1>设备运营中心</h1><div class="sub">设备身份、在线态势、影子同步与批量运维</div></div><span class="healthy">服务正常</span></div><div class="stats" id="stats"></div><div class="work"><section class="card"><h2>受管设备</h2><div id="devices"></div></section><section class="card"><h2>实时告警</h2><div id="alerts"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const names={devices:'设备',online:'在线',alerts:'活动告警',commands:'远程指令',rollouts:'升级任务'};stats.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="card stat"><span class="sub">${names[k]}</span><b>${v}</b></div>`).join('');devices.innerHTML=d.devices.map(x=>`<div class="row"><div><b>${esc(x.Name||x.name)}</b><div class="sub">${esc(x.Product||x.product)}</div></div><span>${esc(x.Site||x.site)}</span><span>${esc(x.Firmware||x.firmware)}</span><span class="online">${esc(x.Status||x.status)}</span></div>`).join('');alerts.innerHTML=d.alerts.map(x=>`<div class="alert"><span class="critical">${esc(x.Severity||x.severity)}</span><b> ${esc(x.Metric||x.metric)}</b><div class="sub">${esc(x.DeviceID||x.deviceId)} · ${esc(x.Value||x.value)}</div></div>`).join('')})</script></body></html>
